# Codemagic has no manual-only trigger setting, so this file has no "triggering"
# block at all: builds start only from the Codemagic web page or its API.
workflows:
  ios_compile_check:
    name: iOS compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
      vars:
        ENTRYPOINT: lib/main.dart
        IOS_DISCOVERY_MODE: subnet_sweep_only
    scripts:
      - name: Get packages
        script: |
          cd app
          flutter pub get
      - name: Build iOS without code signing
        script: |
          cd app
          flutter build ios --debug --no-codesign -t "$ENTRYPOINT" \
            --dart-define=IOS_DISCOVERY_MODE="$IOS_DISCOVERY_MODE"
    artifacts:
      - app/build/ios/iphoneos/*.app
