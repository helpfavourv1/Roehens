name: inspect_packages

# Manual. Resolves dependencies and publishes the layout and glyph names of the
# icon packages to the ci-logs branch, so glyph identifiers are taken from the
# installed source and never guessed (specification C4).

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LOG: ${{ github.workspace }}/ci.log

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve
        working-directory: app
        run: flutter pub get 2>&1 | tail -5 | tee -a "$LOG"

      - name: Inspect phosphor_flutter
        run: |
          DIR=$(python3 -c "import json;d=json.load(open('app/.dart_tool/package_config.json'));print([p['rootUri'] for p in d['packages'] if p['name']=='phosphor_flutter'][0].replace('file://',''))")
          echo "== dir $DIR" | tee -a "$LOG"
          grep -E '^version' "$DIR/pubspec.yaml" | tee -a "$LOG"
          echo "== BOLD NAMES" | tee -a "$LOG"
          grep -hoE 'static const [a-zA-Z0-9_]+' "$DIR/lib/src/phosphor_icons_bold.dart" | awk '{print $3}' | tr '\n' ' ' | fold -w 200 | tee -a "$LOG"
          echo | tee -a "$LOG"
          echo "== counts" | tee -a "$LOG"
          for w in bold fill duotone; do echo "$w $(grep -c 'static const' "$DIR/lib/src/phosphor_icons_$w.dart")" | tee -a "$LOG"; done
          echo "== duotone sample" | tee -a "$LOG"
          grep -hE 'static const' "$DIR/lib/src/phosphor_icons_duotone.dart" | sed -n '1,2p' | tee -a "$LOG"
          echo "== PhosphorIcon widget" | tee -a "$LOG"
          cat "$DIR/lib/src/phosphor_icon.dart" | tee -a "$LOG"
          echo "== icon data" | tee -a "$LOG"
          cat "$DIR/lib/src/phosphor_icon_data.dart" | tee -a "$LOG"

      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: sh tool/ci_publish_log.sh "$LOG" inspect_packages
