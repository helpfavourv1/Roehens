name: emulator_check

# Manual. Runs the integration tests in app/integration_test on a real Android
# emulator (API 34) with flutter drive, which also saves screenshots of what the
# app draws and publishes them to the ci-logs branch (folder screenshots/). It checks what widget tests cannot: the real engine, the
# real text input and the real clipboard. It changes nothing in the repository.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LOG: ${{ github.workspace }}/ci.log

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/visual_spike_test.dart -d emulator-5554 > ../ci.log 2>&1 || (tail -n 120 ../ci.log; exit 1)

      - name: Result
        if: always()
        run: |
          echo "== emulator result" | tee -a "$LOG.tail"
          tail -n 60 "$LOG" 2>/dev/null || echo "no log produced"

      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SCREENSHOT_DIR: ${{ github.workspace }}/app/screenshots
        run: sh tool/ci_publish_log.sh "$LOG" emulator_check
